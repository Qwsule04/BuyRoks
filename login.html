<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BuyRoks</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/theme.js" defer></script>
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Buy Rocks" class="logo" width="340" height="237">
    <nav>
      <ul>
        <li><a href="index.html">Catalog</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="about.html">About us</a></li>
      </ul>
    </nav>
    <button id="theme-toggle" type="button">Switch to dark mode</button>
  </header>

  <main class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4 text-center">Log In</h1>
    
    <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

    <form id="login-form">
      <div class="mb-3">
        <label for="login-email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="login-email" required>
      </div>

      <div class="mb-3">
        <label for="login-password" class="form-label">Password</label>
        <input type="password" class="form-control" id="login-password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2">Log In</button>
      <p class="mt-3 text-center">Don't have an account? <a href="register.html">Register here</a></p>
    </form>
  </main>

  <footer>
    <img src="images/logo.png" alt="Buy Rocks" class="footer-logo" width="340" height="237">
    <p class="copyright">&copy; 2026 Buy Roks. None of the rights reserved.</p>
  </footer>
</body>
</html>
